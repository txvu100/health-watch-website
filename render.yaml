services:
  - type: web
    name: healthwatch-website
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Pinned so `npm ci` resolves the same way it does locally.
      - key: NODE_VERSION
        value: 22.11.0
      # sync: false = Render prompts for this at Blueprint creation and keeps the
      # value out of git. Until it is set the contact form renders its phone-only
      # fallback instead of posting enquiries into the void.
      - key: PUBLIC_FORMSPREE_ID
        sync: false
    headers:
      # ORDER MATTERS: Render applies the LAST matching rule, so the broad
      # default goes first and the specific overrides follow it. Verified
      # against the deployed site — with /_astro/* listed first it lost to /*
      # and hashed assets were served must-revalidate.
      #
      # Default: HTML must revalidate, or content fixes never reach returning
      # visitors.
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      # Content-hashed build output is the only thing safe to cache immutably.
      - path: /_astro/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /sitemap-index.xml
        name: Cache-Control
        value: public, max-age=86400
      - path: /sitemap-*.xml
        name: Cache-Control
        value: public, max-age=86400
    routes:
      # The hand-written Spanish immigration page moved under /es/servicios/ when
      # Spanish service pages became data-generated. Both spellings are listed
      # because any inbound link may or may not carry the trailing slash.
      - type: redirect
        source: /es/examen-medico-inmigracion
        destination: /es/servicios/examen-medico-inmigracion/
      - type: redirect
        source: /es/examen-medico-inmigracion/
        destination: /es/servicios/examen-medico-inmigracion/
